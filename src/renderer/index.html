<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Document Viewer</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' blob:; font-src 'self' blob: data:; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>
  <body>
    <header class="strip">
      <span class="app-mark" aria-hidden="true"><svg viewBox="0 0 256 256"><path fill="currentColor" fill-rule="evenodd" d="M68 28h120a16 16 0 0 1 16 16v168a16 16 0 0 1-16 16H68a16 16 0 0 1-16-16V44a16 16 0 0 1 16-16Z M160 62h44v22h-44Z M178 117h26v22h-26Z M160 172h44v22h-44Z"/></svg></span>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Açık belgeler"></nav>
      <button class="icon-btn open-btn" id="open" type="button" title="Aç (Ctrl+O)" aria-label="Belge aç"></button>
      <div class="tools" id="tools">
        <div class="search" role="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="search" placeholder="Belgede ara" aria-label="Belgede ara" autocomplete="off" spellcheck="false" />
          <output id="search-count" class="search-count" aria-live="polite"></output>
          <button class="icon-btn small" id="search-prev" type="button" title="Önceki (Shift+Enter)" aria-label="Önceki eşleşme"></button>
          <button class="icon-btn small" id="search-next" type="button" title="Sonraki (Enter)" aria-label="Sonraki eşleşme"></button>
        </div>
        <div class="zoom" aria-label="Yakınlaştırma">
          <button class="icon-btn" id="zoom-out" type="button" title="Uzaklaştır (Ctrl+-)" aria-label="Uzaklaştır"></button>
          <button class="ruler" id="ruler" type="button" title="Gerçek boyut (Ctrl+0)" aria-label="Gerçek boyuta dön">
            <span class="ruler-ticks" id="ruler-ticks"></span>
            <span class="ruler-value" id="zoom-value">%100</span>
          </button>
          <button class="icon-btn" id="zoom-in" type="button" title="Yakınlaştır (Ctrl++)" aria-label="Yakınlaştır"></button>
        </div>
        <button class="icon-btn" id="print" type="button" title="Yazdır (Ctrl+P)" aria-label="Yazdır"></button>
      </div>
      <div class="window-controls" role="group" aria-label="Pencere">
        <button class="win-btn" id="win-min" type="button" title="Simge durumuna küçült" aria-label="Simge durumuna küçült"></button>
        <button class="win-btn" id="win-max" type="button" title="Ekranı kapla" aria-label="Ekranı kapla"></button>
        <button class="win-btn close" id="win-close" type="button" title="Kapat" aria-label="Kapat"></button>
      </div>
    </header>

    <main class="table" id="content">
      <div class="notice" id="notice" hidden>
        <span id="notice-text"></span>
        <button class="icon-btn small" id="notice-close" type="button" aria-label="Kapat"></button>
      </div>
      <section class="empty" id="empty">
        <div class="sheet-outline" id="drop-sheet">
          <span class="empty-icon" id="empty-icon"></span>
          <button class="primary-btn" id="empty-open" type="button">Belge aç</button>
          <p>ya da dosyayı buraya sürükle</p>
          <p class="hint"><kbd>Ctrl</kbd> + <kbd>O</kbd></p>
        </div>
        <button class="link-btn" id="default-apps" type="button">Varsayılan uygulama olarak ayarla</button>
      </section>
    </main>

    <footer class="status" id="status">
      <span id="status-position"></span>
      <span id="status-info"></span>
    </footer>

    <dialog class="dialog" id="large-dialog">
      <form method="dialog">
        <h2 id="large-title"></h2>
        <p>Büyük dosyaların açılması uzun sürebilir.</p>
        <div class="dialog-actions">
          <button class="secondary-btn" value="cancel" type="submit">Vazgeç</button>
          <button class="primary-btn" value="open" type="submit">Yine de aç</button>
        </div>
      </form>
    </dialog>

    <div id="print-root"></div>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
