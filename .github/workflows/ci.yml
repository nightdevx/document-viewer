# Tests and type-checks every push to develop and every pull request. Nothing is published here.
name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
